{{- /*
StatefulSet so each replica owns a persistent volume for its own signed
agentic-core audit chain (/var/lib/agent-action-provenance/audit/<pod>.jsonl).
The transparency log itself lives in PostgreSQL and is shared: appends are
serialized by a row lock, so replicas never fork the tree. Sealed batches are
archived to S3 Object Lock (or, with archive.backend=filesystem, to this
volume for a shipper to replicate to immutable storage).
*/ -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "provenance.fullname" . }}
  labels: {{- include "provenance.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "provenance.fullname" . }}-headless
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  podManagementPolicy: Parallel
  selector:
    matchLabels: {{- include "provenance.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "provenance.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}{{ toYaml . | nindent 8 }}{{ end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- range . }}
        - {{- toYaml . | nindent 10 }}
          labelSelector:
            matchLabels: {{- include "provenance.selectorLabels" $ | nindent 14 }}
        {{- end }}
      {{- end }}
      containers:
        - name: provenance
          image: {{ include "provenance.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ include "provenance.fullname" . }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: PROVENANCE_AUDIT_LOG_PATH
              value: /var/lib/agent-action-provenance/audit/$(POD_NAME).jsonl
            - name: PROVENANCE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.database }}
                  key: DATABASE_URL
            - name: PROVENANCE_FORWARDED_ALLOW_IPS
              value: "*"
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
            failureThreshold: 3
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 24
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: log-key
              mountPath: /etc/agent-action-provenance/log-key
              readOnly: true
            - name: audit-key
              mountPath: /etc/agent-action-provenance/audit-key
              readOnly: true
            - name: data
              mountPath: /var/lib/agent-action-provenance
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: log-key
          secret:
            secretName: {{ .Values.secrets.logKey }}
            defaultMode: 0400
        - name: audit-key
          secret:
            secretName: {{ .Values.secrets.auditKey }}
            defaultMode: 0400
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.storage.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.storage.size }}
