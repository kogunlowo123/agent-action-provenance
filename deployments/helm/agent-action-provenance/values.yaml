replicaCount: 3

image:
  repository: ghcr.io/kogunlowo123/agent-action-provenance
  tag: ""  # defaults to .Chart.AppVersion
  digest: ""  # set to pin an immutable sha256 digest; takes precedence over tag
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: agent-action-provenance
  # Cloud workload identity bindings from deployments/terraform/<cloud>, e.g.
  #   eks.amazonaws.com/role-arn (AWS IRSA: S3 Object Lock archive writes)
  #   azure.workload.identity/client-id (Azure Workload ID)
  #   iam.gke.io/gcp-service-account (GKE Workload Identity)
  annotations: {}

podLabels: {}

# Deployment-specific values marked REQUIRED have no default; the chart
# refuses to render until they are set (helm install --values <env>.yaml).
provenance:
  environment: production
  publicUrl: ""  # REQUIRED: public HTTPS URL (A2A agent card, MCP host allow-list)
  # Agent callers are authorized by agent-identity-fabric when fabricUrl is set.
  # Otherwise agent credentials are verified locally against the fabric JWKS and
  # policies/provenance-access.yaml decides; agent.* is then REQUIRED.
  fabricUrl: ""
  agent:
    issuer: ""
    audience: agent-platform
    jwksUrl: ""
  auditor:
    issuer: ""  # REQUIRED: enterprise OIDC issuer for auditors
    audience: ""  # REQUIRED: audience of auditor tokens
    jwksUrl: ""  # REQUIRED: JWKS URL of the enterprise OIDC issuer
    rolesClaim: roles
  batchMaxSize: 256
  batchMaxWaitMs: 50
  exportMaxRecords: 1000
  monitorIntervalSeconds: 60
  archive:
    backend: s3  # s3 (Object Lock) or filesystem (volume shipped to immutable storage)
    bucket: ""  # REQUIRED when backend=s3
    prefix: agent-action-provenance
    region: ""
    lockMode: COMPLIANCE
    retentionDays: 2555
    intervalSeconds: 30
  mcpAllowedHosts: []  # extra Host headers for /mcp; service DNS names are added automatically
  logLevel: INFO
  otlpEndpoint: ""  # optional OTLP gRPC endpoint

# Secrets are created by the platform secret operator (External Secrets,
# Secrets Store CSI) from the cloud secret manager provisioned by Terraform.
secrets:
  # Secret holding key DATABASE_URL (postgresql+asyncpg://...).
  database: agent-action-provenance-database
  # Secret holding log-<kid>.pem, the Ed25519 key that signs tree heads.
  logKey: agent-action-provenance-log-key
  logKeyFile: ""  # REQUIRED: file name of the log key within secrets.logKey
  # Secret holding audit-<kid>.pem, the Ed25519 audit-chain signing key.
  auditKey: agent-action-provenance-audit-key
  auditKeyFile: ""  # REQUIRED: file name of the audit key within secrets.auditKey

storage:
  storageClassName: ""
  size: 20Gi  # per replica: signed audit chain (and archive staging for backend=filesystem)

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  host: ""  # required when ingress.enabled
  tlsSecret: agent-action-provenance-tls
  annotations: {}

resources:
  requests:
    cpu: 250m
    memory: 384Mi
  limits:
    cpu: "1"
    memory: 768Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  minAvailable: 2

networkPolicy:
  enabled: true
  # Namespaces whose pods may call the engine (agents, MCP/A2A gateway).
  allowedNamespaceLabels:
    agent-platform/member: "true"
  monitoringNamespaceLabels:
    kubernetes.io/metadata.name: observability
  ingressNamespaceLabels:
    kubernetes.io/metadata.name: ingress-nginx

serviceMonitor:
  enabled: false
  interval: 30s

nodeSelector: {}
tolerations: []
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
