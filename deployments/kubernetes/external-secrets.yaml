# Syncs provenance secrets from the cloud secret manager provisioned by
# deployments/terraform/<cloud>. Requires the External Secrets Operator and a
# ClusterSecretStore named "platform-secrets" bound to that secret manager.
# Remote keys match the names Terraform creates (database URL) and the names
# the key-ceremony runbook uses for the Ed25519 keys (never created by Terraform).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: agent-action-provenance-database
  namespace: agent-provenance
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secrets
  target:
    name: agent-action-provenance-database
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: agent-action-provenance-database-url
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: agent-action-provenance-log-key
  namespace: agent-provenance
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secrets
  target:
    name: agent-action-provenance-log-key
    creationPolicy: Owner
  dataFrom:
    - find:
        name:
          regexp: "^agent-action-provenance-log-key-"
      rewrite:
        - regexp:
            source: "^agent-action-provenance-log-key-(.*)$"
            target: "log-$1.pem"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: agent-action-provenance-audit-key
  namespace: agent-provenance
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secrets
  target:
    name: agent-action-provenance-audit-key
    creationPolicy: Owner
  dataFrom:
    - find:
        name:
          regexp: "^agent-action-provenance-audit-key-"
      rewrite:
        - regexp:
            source: "^agent-action-provenance-audit-key-(.*)$"
            target: "audit-$1.pem"
